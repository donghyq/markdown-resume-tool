name: Check resume tool

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Chromium and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:browser
      - name: Verify direct PDF export
        run: node cli.cjs examples/sample.md --html tmp/ci-sample.html --pdf tmp/ci-sample.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-output
          path: tmp/
